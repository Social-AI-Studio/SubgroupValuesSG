# LoRA SFT of meta-llama/Llama-3.2-3B-Instruct
# Released adapter: https://huggingface.co/Incomple/Llama-3.2-3B-Instruct_sft_sg_values
# Trained on 2 GPUs (effective batch size 16). Run from the repository root:
#   CUDA_VISIBLE_DEVICES=0,1 llamafactory-cli train training/configs/llama-3.2-3b.yaml

### model
model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset_dir: training
dataset: sft_sg_values
template: llama3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: outputs/adapters/Llama-3.2-3B-Instruct_sft_sg_values
logging_steps: 0.05
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
num_train_epochs: 1.0
lr_scheduler_type: linear
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: sft_sg_values_eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 250
